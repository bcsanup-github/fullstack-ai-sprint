<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Prompt Tester</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-xl">
            <h1 class="text-2xl font-bold mb-4">AI Prompt Tester</h1>

            <form id="prompt-form">
                <textarea id="prompt" rows="4"
                class="w-full border rounded p-2 mb-3"
                placeholder="Type a prompt....."></textarea>
                <button id="submit-btn" type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded disabled:bg-gray-400">
                Run
              </button>
            </form>
            <div id="output" class="mt-4 p-3 bg-gray-50 rounded min-h-12 whitespace-pre-wrap"></div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
